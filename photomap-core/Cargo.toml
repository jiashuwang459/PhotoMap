[package]
name = "photomap-core"
version = "0.1.0"
edition = "2021"
description = "Database layer and domain logic for PhotoMap"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
thiserror = "1"
sha2 = "0.11"
walkdir = "2.5"
kamadak-exif = "0.6"

[dev-dependencies]
tempfile = "3.27"
